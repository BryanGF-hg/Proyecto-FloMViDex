<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaidCore Player</title>
    <link rel="icon" type="image/x-icon" href="https://raw.githubusercontent.com/BryanGF-hg/Proyecto-FloMViDex/refs/heads/main/media/Images/Logo/medevil%20100x100.png">    
    <style>
      * {margin: 0; padding: 0; box-sizing: border-box; font-family: "Tahoma","Arial",sans-serif; font-size: 11px;}
      body {background-image: url('https://raw.githubusercontent.com/BryanGF-hg/Proyecto-FloMViDex/refs/heads/main/media/Images/wallpaper/wallpaper-v0-ww00n61..._imresizer.png'); height: 100vh; overflow: hidden;}

      .window {width: 300px; height: 435px; background-color: #c0c0c0; border: 2px solid; border-top-color: #fff; border-left-color: #fff; border-right-color: #808080; border-bottom-color: #808080; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); box-shadow: 4px 4px 10px rgba(0,0,0,0.5);}
      .window-title {padding-left: 5px;}
      .window-content {padding: 10px; height: calc(100% - 28px); overflow: auto;}
      .title-bar {background: linear-gradient(135deg,#000080,#F2F7F2); color: white; padding: 4px; height: 28px; display: flex; align-items: center; justify-content: space-between; font-weight: bold; font-size: 12px;}

      .window-controls {display: flex;}
      .control-btn {width: 20px; height: 20px; margin-left: 2px; background-color: #c0c0c0; border: 1px solid; border-top-color: #fff; border-left-color: #fff; border-right-color: #808080; border-bottom-color: #808080; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 10px; cursor: pointer;}
      .control-btn:active {border-top-color: #808080; border-left-color: #808080; border-right-color: #fff; border-bottom-color: #fff;}

      /* Navegador de directorios */
      .dir-nav {height:58px;background-color: #c0c0c0; border: 2px inset; padding: 5px;display: flex; gap:1px;}
      .dir-btn {background-color: #c0c0c0; border: 2px solid; border-top-color: #fff; border-left-color: #fff; border-right-color: #808080; border-bottom-color: #808080; cursor: pointer; font-weight: bold;}
      .dir-btn.active {border-top-color: #808080; border-left-color: #808080; border-right-color: #fff; border-bottom-color: #fff; background-color: #000080; color: white;}
      .dir-stats {margin-left: auto; color: #000080; font-weight: bold; padding: 5px;}

      .player {background-color: #c0c0c0; border: 2px inset; padding: 15px; margin-bottom: 10px;}
      .player-display {background-color: black; color: #00ff00; padding: 10px; font-family: "Courier New", monospace; font-size: 12px; border: 1px inset;height:80px;}
      .player-controls {display: flex; justify-content: center;margin-bottom:3px;}
      .player-btn {width: 80px; height: 25px; background-color: #c0c0c0; border: 2px solid; border-top-color: #fff; border-left-color: #fff; border-right-color: #808080; border-bottom-color: #808080; cursor: pointer; font-size: 10px; font-weight: bold;}
      .player-btn:active {border-top-color: #808080; border-left-color: #808080; border-right-color: #fff; border-bottom-color: #fff;}

      /* Contenedor de lista de canciones */
      .playlist-container {background-color: #c0c0c0; border: 2px inset;}
      .playlist-header {font-weight: bold; padding: 5px; margin-bottom: 5px; background: linear-gradient(90deg, #000080, #1084d0); color: white;}
      .playlist {background-color: white; border: 2px inset; height: 300px; overflow-y: auto;}
      .playlist-item {padding: 5px 8px; cursor: pointer; border-bottom: 1px dotted #c0c0c0; display: flex; align-items: center; gap: 10px;}
      .playlist-item.active {background-color: #000080; color: white; font-weight: bold;}
      .playlist-number {color: #808080; width: 30px;}
      .playlist-title {flex: 1;}
      .playlist-duration {color: #808080;}
      
      .playlist-item:hover {background-color: #000080; color: white;}      
      .playlist-item:hover .playlist-number {color: white;}      
      .playlist-item:hover .playlist-duration {color: white;}

      .taskbar {position: fixed; bottom: 0; left: 0; width: 100%; height: 40px; background-color: #c0c0c0; border-top: 2px solid #fff; display: flex; align-items: center; padding: 0 5px; z-index: 1000;}
      .taskbar-items {display: flex; gap: 5px; flex-grow: 1;}
      .taskbar-item {background-color: #c0c0c0; border: 2px solid; border-top-color: #fff; border-left-color: #fff; border-right-color: #808080; border-bottom-color: #808080; padding: 5px 10px; min-width: 120px; cursor: pointer; font-size: 10px;}
      .taskbar-item.active {border-top-color: #808080; border-left-color: #808080; border-right-color: #fff; border-bottom-color: #fff;}

      .start-btn {width: 80px; height: 30px; background-color: #c0c0c0; border: 2px solid; border-top-color: #fff; border-left-color: #fff; border-right-color: #808080; border-bottom-color: #808080; display: flex; align-items: center; padding: 0 8px; font-weight: bold; font-size: 12px; cursor: pointer; margin-right: 10px;}
      .start-btn:active {border-top-color: #808080; border-left-color: #808080; border-right-color: #fff; border-bottom-color: #fff;}
      .start-icon {background-color: #008080; color: white; width: 16px; height: 16px; display: flex; align-items: center; justify-content: center; margin-right: 5px; font-weight: bold;}

      .clock {background-color: #c0c0c0; border: 2px inset; padding: 5px 10px; font-size: 11px; min-width: 100px; text-align: center; margin-left: 10px;}

      /* Scrollbars estilo Windows */
      ::-webkit-scrollbar {width: 16px;}
      ::-webkit-scrollbar-thumb {background-color: #c0c0c0; border: 2px solid; border-top-color: #fff; border-left-color: #fff; border-right-color: #808080; border-bottom-color: #808080;}
    </style>
</head>
<body>
    <!-- Elemento de audio oculto -->
    <audio id="audio-player" style="display: none;"></audio>

    <!-- VENTANA PRINCIPAL -->
    <div class="window">
        <div class="title-bar">
            <div class="window-title">MaidCore Player v2.0</div>
            <div class="window-controls">
                <div class="control-btn">_</div>
                <div class="control-btn">□</div>
                <div class="control-btn">X</div>
            </div>
        </div>
        
        <div class="window-content">
            <!-- Navegador de directorios -->
            <div class="dir-nav">
                <button class="dir-btn active" data-dir="mc1">maidcore 1.0</button>
                <button class="dir-btn" data-dir="mc2">maidcore 2.0</button>
                <button class="dir-btn" data-dir="mc3">maidcore 3.0</button>
                <button class="dir-btn" data-dir="mc4">maidcore 4.0</button>
                <div class="dir-stats" id="dir-stats">Total: 1515 tracks</div>
            </div>

            <!-- REPRODUCTOR -->
            <div class="player">
                <div class="player-display" id="display">
                    MaidCore Player - Ready<br>
                    -----------------------<br>
                    Now Playing: [Stopped]<br>
                    Time: 00:00 / 00:00
                </div>
                
                <div class="player-controls">
                    <button class="player-btn" onclick="playSong()">▶ Play</button>
                    <button class="player-btn" onclick="pauseSong()">⏸ Pause</button>
                    <button class="player-btn" onclick="stopSong()">⏹ Stop</button>
                    <button class="player-btn" onclick="prevSong()">⏮ Prev</button>                    
                    <button class="player-btn" onclick="nextSong()">⏭ Next</button>
                </div>
            </div>

            <!-- Lista de canciones -->
            <div class="playlist-container">
                <div class="playlist-header" id="playlist-header">📁 maidcore 1.0 - 470 tracks</div>
                <div class="playlist" id="playlist">
                    <!-- Las canciones se cargan dinámicamente -->
                </div>
            </div>
        </div>
    </div>

    <!-- BARRA DE TAREAS (TASKBAR) -->
    <div class="taskbar">
        <div class="start-btn" onclick="toggleStartMenu()">
            <div class="start-icon">M</div>
            Start
        </div>
        
        <div class="taskbar-items">
            <div class="taskbar-item active" onclick="focusWindow()">MaidCore Player</div>
            <div class="taskbar-item" onclick="openExplorer()">🗀 Song Explorer</div>
            <div class="taskbar-item" onclick="openBrowser()"><> Now Playing</div>
        </div>
        
        <div class="clock" id="clock">12:00:00</div>
    </div>

    <script>
        // Configuración de directorios
        const DIR_CONFIG = {
            mc1: { name: 'maidcore 1.0', path: 'maidcore 1.0', count: 470 },
            mc2: { name: 'maidcore 2.0', path: 'maidcore 2.0', count: 453 },
            mc3: { name: 'maidcore 3.0', path: 'maidcore 3.0', count: 452 },
            mc4: { name: 'maidcore 4.0', path: 'maidcore 4.0', count: 140 }
        };
        // Variables del reproductor
        let currentDirectory = 'mc1';
        let currentSongIndex = 0;
        let isPlaying = false;
        let songs = []; // Se llenará con los archivos reales
        let fileBlobs = new Map(); // Almacenar blobs por ruta

        // Elementos del DOM
        const audioPlayer = document.getElementById('audio-player');
        const display = document.getElementById('display');
        const playlistEl = document.getElementById('playlist');
        const playlistHeader = document.getElementById('playlist-header');
        const dirStats = document.getElementById('dir-stats');
        const playingStatus = document.getElementById('playing-status');

        // Escanear directorio actual (simulado - en producción sería AJAX)
        async function loadSongsFromDirectory(dir) {
            const config = DIR_CONFIG[dir];
            playlistHeader.textContent = `📁 ${config.name} - ${config.count} tracks`;
            
            // Aquí harías una petición AJAX para obtener la lista real de archivos
            // Por ahora, generamos canciones de ejemplo con nombres realistas
            songs = [];
            for (let i = 1; i <= config.count; i++) {
                const artistIndex = (i % 10) + 1;
                const artists = [
                    'Chikoi The Maid', 'Yakui The Maid', 'Madoi The Maid', 
                    'Medoi The Maid', 'Kichi', 'Dante & Hema The Maids',
                    'Akui The Maid', 'Hidoi The Maid', 'Dorei The Maid', 'Kaitai The Maid'
                ];
                
                songs.push({
                    id: i,
                    title: generateSongTitle(i, artists[artistIndex % artists.length]),
                    artist: artists[artistIndex % artists.length],
                    file: `track_${String(i).padStart(4, '0')}.mp3`,
                    duration: `${Math.floor(Math.random() * 3) + 2}:${String(Math.floor(Math.random() * 59) + 1).padStart(2, '0')}`,
                    path: `../media/mp3/real mp3/${config.path}/track_${String(i).padStart(4, '0')}.mp3`
                });
            }
            
            renderPlaylist();
            updateDisplay();
        }

        // Generar títulos de canciones (simulado)
        function generateSongTitle(index, artist) {
            const titles = [
                'Digital Dreams', 'Neon Paradise', 'Cherry Blossom', 
                'Midnight Cafe', 'Electric Heart', 'Virtual Love',
                'Cyberpunk Maid', 'Tokyo Rain', 'Starlight', 'Eternal Promise',
                'Binary Emotion', 'Quantum Wave', 'Crystal Tears', 'Maidcore Anthem'
            ];
            return `${artist} - ${titles[index % titles.length]} ${Math.floor(index / titles.length) + 1}`;
        }

        // Renderizar playlist
        function renderPlaylist() {
            if (!songs.length) {
                playlistEl.innerHTML = '<div style="padding: 20px; text-align: center;">No hay canciones en este directorio</div>';
                return;
            }

            let html = '';
            songs.forEach((song, index) => {
                const activeClass = index === currentSongIndex ? 'active' : '';
                html += `
                    <div class="playlist-item ${activeClass}" onclick="selectSong(${index})">
                        <span class="playlist-number">${String(index + 1).padStart(3, '0')}</span>
                        <span class="playlist-title">${song.title}</span>
                        <span class="playlist-duration">${song.duration}</span>
                    </div>
                `;
            });
            playlistEl.innerHTML = html;
            trackCount.textContent = `${songs.length} tracks`;
        }

        // Función playInHeader adaptada del admin dashboard
        function playInHeader(track) {
            if (!track) return;
            
            const key = `${currentDirectory}_${track.id}`;
            let blobUrl = fileBlobs.get(key);
            
            if (blobUrl) {
                audioPlayer.src = blobUrl; // Reproducir desde Blob
            } else {
                // Intentar cargar el archivo real
                audioPlayer.src = track.path;
            }

            audioPlayer.play()
                .then(() => {
                    isPlaying = true;
                    currentSongIndex = songs.findIndex(t => t.id === track.id);
                    updateDisplay();
                    renderPlaylist();
                })
                .catch(err => {
                    console.error('Error reproduciendo:', err);
                    display.innerHTML = `MaidCore Player - Error<br>-----------------------<br>No se pudo cargar: ${track.file}`;
                });
        }

        // Funciones del reproductor
        function selectSong(index) {
            if (index >= 0 && index < songs.length) {
                currentSongIndex = index;
                playInHeader(songs[currentSongIndex]);
            }
        }

        function playSong() {
            if (songs.length === 0) return;
            
            if (audioPlayer.src && audioPlayer.src !== '') {
                audioPlayer.play();
                isPlaying = true;
            } else {
                playInHeader(songs[currentSongIndex]);
            }
            updateDisplay();
        }

        function pauseSong() {
            audioPlayer.pause();
            isPlaying = false;
            updateDisplay();
        }

        function stopSong() {
            audioPlayer.pause();
            audioPlayer.currentTime = 0;
            isPlaying = false;
            updateDisplay();
        }

        function nextSong() {
            if (songs.length === 0) return;
            currentSongIndex = (currentSongIndex + 1) % songs.length;
            playInHeader(songs[currentSongIndex]);
        }

        function prevSong() {
            if (songs.length === 0) return;
            currentSongIndex = (currentSongIndex - 1 + songs.length) % songs.length;
            playInHeader(songs[currentSongIndex]);
        }

        // Actualizar display
        function updateDisplay() {
            if (songs.length === 0) {
                display.innerHTML = `MaidCore Player - Ready<br>-----------------------<br>No tracks available`;
                return;
            }

            const track = songs[currentSongIndex];
            const status = isPlaying ? "Playing" : (audioPlayer.paused ? "Paused" : "Stopped");
            playingStatus.textContent = status;
            
            let currentTime = "00:00";
            let duration = track.duration;

            if (audioPlayer.duration && !isNaN(audioPlayer.duration)) {
                const format = (seconds) => {
                    const mins = Math.floor(seconds / 60);
                    const secs = Math.floor(seconds % 60);
                    return `${mins}:${String(secs).padStart(2, '0')}`;
                };
                currentTime = format(audioPlayer.currentTime);
                duration = format(audioPlayer.duration);
            }

            display.innerHTML = 
                `MaidCore Player - ${status}<br>-----------------------<br>` +
                `Now Playing: ${track.title}<br>` +
                `Time: ${currentTime} / ${duration}`;
        }

        // Cambiar de directorio
        function switchDirectory(dir) {
            currentDirectory = dir;
            currentSongIndex = 0;
            
            // Actualizar botones activos
            document.querySelectorAll('.dir-btn').forEach(btn => {
                if (btn.dataset.dir === dir) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
            
            // Cargar canciones del directorio
            loadSongsFromDirectory(dir);
            
            // Detener reproducción actual
            audioPlayer.pause();
            audioPlayer.src = '';
        }

        // Event listeners para directorios
        document.querySelectorAll('.dir-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                switchDirectory(btn.dataset.dir);
            });
        });

        // Eventos del audio
        audioPlayer.addEventListener('timeupdate', updateDisplay);
        audioPlayer.addEventListener('loadedmetadata', updateDisplay);
        audioPlayer.addEventListener('play', () => {
            isPlaying = true;
            updateDisplay();
        });
        audioPlayer.addEventListener('pause', () => {
            isPlaying = false;
            updateDisplay();
        });
        audioPlayer.addEventListener('ended', () => {
            nextSong(); // Pasar a la siguiente canción automáticamente
        });

        // Funciones de interfaz existentes
        function toggleStartMenu() {
            alert('[Start Menu]\n\nPrograms:\n• MaidCore Player\n• MaidCore Explorer\n• Settings\n• Help\n• About\n\nTotal tracks: 1515');
        }

        function focusWindow() {
            document.querySelector('.window').style.zIndex = '1000';
        }

        function openExplorer() {
            alert('📁 Song Explorer\n\nDirectories:\n' + 
                  Object.values(DIR_CONFIG).map(d => `• ${d.name}: ${d.count} tracks`).join('\n'));
        }

        function openBrowser() {
            const track = songs[currentSongIndex];
            if (track) {
                alert(`🎵 Now Playing:\n\n${track.title}\n📁 ${DIR_CONFIG[currentDirectory].name}`);
            } else {
                alert('No track playing');
            }
        }

        // Reloj
        function updateClock() {
            const now = new Date();
            const time = now.toLocaleTimeString('es-ES', { hour12: false });
            document.getElementById('clock').textContent = time;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Arrastre de ventana con límites
        let isDragging = false;
        let offsetX, offsetY;
        const windowEl = document.querySelector('.window');
        const titleBar = document.querySelector('.title-bar');

        function startDrag(e) {
            isDragging = true;
            offsetX = e.clientX - windowEl.offsetLeft;
            offsetY = e.clientY - windowEl.offsetTop;
            windowEl.style.cursor = 'move';
        }

        function drag(e) {
            if (!isDragging) return;
            
            const winWidth = windowEl.offsetWidth;
            const winHeight = windowEl.offsetHeight;
            const viewportWidth = window.innerWidth;
            const viewportHeight = window.innerHeight - 40; // Restar altura de taskbar
            
            let newLeft = e.clientX - offsetX;
            let newTop = e.clientY - offsetY;
            
            newLeft = Math.max(0, Math.min(newLeft, viewportWidth - winWidth));
            newTop = Math.max(0, Math.min(newTop, viewportHeight - winHeight));
            
            windowEl.style.left = newLeft + 'px';
            windowEl.style.top = newTop + 'px';
            windowEl.style.transform = 'none';
        }

        function stopDrag() {
            isDragging = false;
            windowEl.style.cursor = 'default';
        }

        titleBar.addEventListener('mousedown', startDrag);
        document.addEventListener('mousemove', drag);
        document.addEventListener('mouseup', stopDrag);

        // Control de botones de ventana
        document.querySelectorAll('.control-btn').forEach((btn, index) => {
            btn.addEventListener('click', function() {
                if (index === 0) { // Minimizar
                    windowEl.style.display = 'none';
                    document.querySelector('.taskbar-item').textContent = 'MaidCore Player [Minimized]';
                } else if (index === 1) { // Maximizar/Restaurar
                    if (windowEl.style.width === '100%') {
                        windowEl.style.width = '800px';
                        windowEl.style.height = '600px';
                        windowEl.style.top = '50%';
                        windowEl.style.left = '50%';
                        windowEl.style.transform = 'translate(-50%, -50%)';
                    } else {
                        windowEl.style.width = '100%';
                        windowEl.style.height = 'calc(100vh - 40px)';
                        windowEl.style.top = '0';
                        windowEl.style.left = '0';
                        windowEl.style.transform = 'none';
                    }
                } else if (index === 2) { // Cerrar
                    if (confirm('Close MaidCore Player?')) {
                        windowEl.style.display = 'none';
                        document.querySelector('.taskbar-item').textContent = 'MaidCore Player [Closed]';
                        document.querySelector('.taskbar-item').classList.remove('active');
                    }
                }
            });
        });

        // Restaurar ventana desde taskbar
        document.querySelector('.taskbar-item').addEventListener('click', function() {
            windowEl.style.display = 'block';
            this.textContent = 'MaidCore Player';
            this.classList.add('active');
        });

        // Inicializar con el primer directorio
        loadSongsFromDirectory('mc1');

        // Total de tracks en la barra de estado
        dirStats.textContent = `Total: 1515 tracks`;
    </script>
</body>
</html>
